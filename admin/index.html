<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — LOOVIiPhnes Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body>

  <div class="login-screen">
    <div class="login-card">
      <div class="login-logo">LOOVI<span>iPhnes</span></div>
      <div class="login-sub">Painel Administrativo</div>
      <form id="loginForm">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <div class="form-error" id="loginError"></div>
        <button type="submit" class="btn">Entrar</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script>
    redirectIfAuthed();

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando...';

      let error;
      try {
        ({ error } = await supabaseClient.auth.signInWithPassword({ email, password }));
      } catch (err) {
        console.error('Falha ao chamar o Supabase Auth:', err);
        errorEl.textContent = 'Erro de conexão com o servidor. Veja o console (F12) para detalhes.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
        return;
      }

      if (error) {
        console.error('Erro retornado pelo Supabase Auth:', error);
        errorEl.textContent = error.message === 'Email not confirmed'
          ? 'Seu e-mail ainda não foi confirmado. Confirme o cadastro no Supabase (Authentication > Users) antes de entrar.'
          : 'E-mail ou senha inválidos.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
        return;
      }

      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
