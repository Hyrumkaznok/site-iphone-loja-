<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — LOOVIiPhnes Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body>

  <header class="admin-topbar">
    <a href="dashboard.html" class="admin-logo">LOOVI<span>iPhnes</span> <small>admin</small></a>
    <nav class="admin-nav">
      <a href="dashboard.html" class="admin-nav-link">Dashboard</a>
      <a href="clientes.html" class="admin-nav-link active">Clientes</a>
      <a href="financeiro.html" class="admin-nav-link">Financeiro</a>
    </nav>
    <button class="admin-logout" onclick="logout()">Sair</button>
  </header>

  <main class="admin-main">
    <div class="admin-header-row">
      <div>
        <h1 class="admin-title">Clientes</h1>
        <div class="admin-subtitle" style="margin-bottom:0">Cadastro e histórico de clientes</div>
      </div>
      <button class="btn" onclick="openNovoCliente()">+ Novo Cliente</button>
    </div>

    <div class="form-group" style="max-width:320px">
      <input type="text" id="buscaCliente" placeholder="Buscar por nome...">
    </div>

    <div class="admin-panel" style="padding:0">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>WhatsApp</th>
            <th>E-mail</th>
          </tr>
        </thead>
        <tbody id="clientesBody">
          <tr><td colspan="4" class="empty-state">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- MODAL NOVO CLIENTE -->
  <div class="modal-overlay" id="modalCliente">
    <div class="modal">
      <button class="modal-close" onclick="closeNovoCliente()">×</button>
      <h3>Novo Cliente</h3>
      <form id="formCliente">
        <div class="form-group">
          <label>Nome</label>
          <input type="text" id="clienteNome" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Telefone</label>
            <input type="tel" id="clienteTelefone">
          </div>
          <div class="form-group">
            <label>WhatsApp</label>
            <input type="tel" id="clienteWhatsapp">
          </div>
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="clienteEmail">
        </div>
        <div class="form-group">
          <label>Observações</label>
          <textarea id="clienteObservacoes"></textarea>
        </div>
        <div class="form-error" id="clienteError"></div>
        <button type="submit" class="btn">Salvar Cliente</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script>
    let todosClientes = [];

    function openNovoCliente() {
      document.getElementById('modalCliente').classList.add('open');
    }

    function closeNovoCliente() {
      document.getElementById('modalCliente').classList.remove('open');
      document.getElementById('formCliente').reset();
      document.getElementById('clienteError').textContent = '';
    }

    function renderClientes(lista) {
      const body = document.getElementById('clientesBody');
      if (!lista || lista.length === 0) {
        body.innerHTML = '<tr><td colspan="4" class="empty-state">Nenhum cliente encontrado.</td></tr>';
        return;
      }
      body.innerHTML = lista.map(c => `
        <tr onclick="window.location.href='cliente.html?id=${c.id}'">
          <td>${c.nome}</td>
          <td class="mono">${c.telefone ?? '-'}</td>
          <td class="mono">${c.whatsapp ?? '-'}</td>
          <td>${c.email ?? '-'}</td>
        </tr>
      `).join('');
    }

    async function carregarClientes() {
      const { data, error } = await supabaseClient.from('clientes').select('*').order('nome');
      if (error) {
        document.getElementById('clientesBody').innerHTML = '<tr><td colspan="4" class="empty-state">Erro ao carregar clientes.</td></tr>';
        return;
      }
      todosClientes = data || [];
      renderClientes(todosClientes);
    }

    document.getElementById('buscaCliente').addEventListener('input', function (e) {
      const termo = e.target.value.trim().toLowerCase();
      renderClientes(todosClientes.filter(c => c.nome.toLowerCase().includes(termo)));
    });

    document.getElementById('formCliente').addEventListener('submit', async function (e) {
      e.preventDefault();
      const errorEl = document.getElementById('clienteError');
      errorEl.textContent = '';

      const novoCliente = {
        nome: document.getElementById('clienteNome').value.trim(),
        telefone: document.getElementById('clienteTelefone').value.trim() || null,
        whatsapp: document.getElementById('clienteWhatsapp').value.trim() || null,
        email: document.getElementById('clienteEmail').value.trim() || null,
        observacoes: document.getElementById('clienteObservacoes').value.trim() || null
      };

      const { error } = await supabaseClient.from('clientes').insert(novoCliente);
      if (error) {
        errorEl.textContent = 'Erro ao salvar cliente. Tente novamente.';
        return;
      }

      closeNovoCliente();
      carregarClientes();
    });

    (async function () {
      const session = await requireAuth();
      if (!session) return;
      carregarClientes();
    })();
  </script>
</body>
</html>
