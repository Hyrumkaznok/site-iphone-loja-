<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro — LOOVIiPhnes Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body>

  <header class="admin-topbar">
    <a href="dashboard.html" class="admin-logo">LOOVI<span>iPhnes</span> <small>admin</small></a>
    <nav class="admin-nav">
      <a href="dashboard.html" class="admin-nav-link">Dashboard</a>
      <a href="clientes.html" class="admin-nav-link">Clientes</a>
      <a href="financeiro.html" class="admin-nav-link active">Financeiro</a>
    </nav>
    <button class="admin-logout" onclick="logout()">Sair</button>
  </header>

  <main class="admin-main">
    <div class="admin-header-row">
      <div>
        <h1 class="admin-title">Financeiro</h1>
        <div class="admin-subtitle" style="margin-bottom:0">Entradas e saídas do caixa</div>
      </div>
      <button class="btn" onclick="openNovoLancamento()">+ Novo Lançamento</button>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><strong id="statEntradas">—</strong><span>Entradas</span></div>
      <div class="stat-card"><strong id="statSaidas">—</strong><span>Saídas</span></div>
      <div class="stat-card"><strong id="statSaldo">—</strong><span>Saldo</span></div>
    </div>

    <div class="admin-panel" style="padding:0">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Data</th>
            <th>Tipo</th>
            <th>Descrição</th>
            <th>Cliente</th>
            <th>Valor</th>
          </tr>
        </thead>
        <tbody id="financeiroBody">
          <tr><td colspan="5" class="empty-state">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- MODAL NOVO LANÇAMENTO -->
  <div class="modal-overlay" id="modalLancamento">
    <div class="modal">
      <button class="modal-close" onclick="closeNovoLancamento()">×</button>
      <h3>Novo Lançamento</h3>
      <form id="formLancamento">
        <div class="form-row">
          <div class="form-group">
            <label>Tipo</label>
            <select id="lancamentoTipo">
              <option value="entrada">Entrada</option>
              <option value="saida">Saída</option>
            </select>
          </div>
          <div class="form-group">
            <label>Valor (R$)</label>
            <input type="number" id="lancamentoValor" step="0.01" min="0" required>
          </div>
        </div>
        <div class="form-group">
          <label>Descrição</label>
          <input type="text" id="lancamentoDescricao" required>
        </div>
        <div class="form-group">
          <label>Data</label>
          <input type="date" id="lancamentoData" required>
        </div>
        <div class="form-error" id="lancamentoError"></div>
        <button type="submit" class="btn">Salvar Lançamento</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script>
    function openNovoLancamento() {
      document.getElementById('lancamentoData').value = new Date().toISOString().slice(0, 10);
      document.getElementById('modalLancamento').classList.add('open');
    }

    function closeNovoLancamento() {
      document.getElementById('modalLancamento').classList.remove('open');
      document.getElementById('formLancamento').reset();
      document.getElementById('lancamentoError').textContent = '';
    }

    async function carregarFinanceiro() {
      const { data, error } = await supabaseClient
        .from('financeiro')
        .select('*, clientes(nome)')
        .order('data', { ascending: false });

      const body = document.getElementById('financeiroBody');
      if (error) {
        body.innerHTML = '<tr><td colspan="5" class="empty-state">Erro ao carregar lançamentos.</td></tr>';
        return;
      }

      const lista = data || [];
      const entradas = lista.filter(l => l.tipo === 'entrada').reduce((soma, l) => soma + Number(l.valor || 0), 0);
      const saidas = lista.filter(l => l.tipo === 'saida').reduce((soma, l) => soma + Number(l.valor || 0), 0);

      document.getElementById('statEntradas').textContent = formatBRL(entradas);
      document.getElementById('statSaidas').textContent = formatBRL(saidas);
      document.getElementById('statSaldo').textContent = formatBRL(entradas - saidas);

      if (lista.length === 0) {
        body.innerHTML = '<tr><td colspan="5" class="empty-state">Nenhum lançamento registrado ainda.</td></tr>';
        return;
      }

      body.innerHTML = lista.map(l => `
        <tr>
          <td class="mono">${formatDate(l.data)}</td>
          <td><span class="tag tag-${l.tipo}">${l.tipo === 'entrada' ? 'Entrada' : 'Saída'}</span></td>
          <td>${l.descricao}</td>
          <td>${l.clientes?.nome ?? '-'}</td>
          <td class="mono">${formatBRL(l.valor)}</td>
        </tr>
      `).join('');
    }

    document.getElementById('formLancamento').addEventListener('submit', async function (e) {
      e.preventDefault();
      const errorEl = document.getElementById('lancamentoError');
      errorEl.textContent = '';

      const lancamento = {
        tipo: document.getElementById('lancamentoTipo').value,
        valor: parseFloat(document.getElementById('lancamentoValor').value || '0'),
        descricao: document.getElementById('lancamentoDescricao').value.trim(),
        data: document.getElementById('lancamentoData').value
      };

      const { error } = await supabaseClient.from('financeiro').insert(lancamento);
      if (error) {
        errorEl.textContent = 'Erro ao salvar lançamento.';
        return;
      }

      closeNovoLancamento();
      carregarFinanceiro();
    });

    (async function () {
      const session = await requireAuth();
      if (!session) return;
      carregarFinanceiro();
    })();
  </script>
</body>
</html>
